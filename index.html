<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ミサイル・コマンド</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one-screen arcade cabinet. A 2:3 radar screen letterboxed in the viewport; HTML overlay for title / results. Single dark look by choice. */
:root{
  --ink:#0a1024;        /* night sky */
  --ink-2:#121a38;
  --grid:#1d2a55;
  --amber:#ffb547;      /* our interceptors / HUD */
  --coral:#ff5d6c;      /* enemy */
  --sky:#7fd4ff;        /* cities */
  --paper:#e9ecff;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--paper)}
body{
  font-family:var(--font);margin:0;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px;box-sizing:border-box;
  display:flex;align-items:center;justify-content:center;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#screen{position:relative;max-width:100%;max-height:100%;aspect-ratio:2/3;border-radius:10px;overflow:hidden;
  box-shadow:0 0 0 1px var(--grid),0 20px 60px rgba(0,0,0,.5)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:rgba(10,16,36,.78);text-align:center;padding:24px;box-sizing:border-box}
.overlay h1{margin:0;font-size:clamp(28px,8vw,46px);font-weight:400;letter-spacing:.06em;color:var(--amber);
  text-shadow:0 0 18px rgba(255,181,71,.45);line-height:1.15;text-wrap:balance}
.overlay h1 small{display:block;font-size:.36em;letter-spacing:.4em;color:var(--sky);margin-top:6px}
.overlay p{margin:0;max-width:30ch;line-height:1.7;font-size:15px;color:var(--paper)}
.overlay .keys{font-size:13px;color:#a9b3e0;line-height:1.8}
.overlay .keys b{color:var(--amber);font-weight:400;border:1px solid var(--grid);padding:0 6px;border-radius:4px}
.big{font-size:22px;color:var(--amber)}
button{font-family:var(--font);font-size:20px;letter-spacing:.12em;color:var(--ink);background:var(--amber);
  border:0;border-radius:6px;padding:12px 30px;cursor:pointer;box-shadow:0 4px 0 #a96b17}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #a96b17}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
#pauseBtn{position:absolute;top:8px;right:8px;font-size:14px;padding:4px 10px;letter-spacing:0;
  background:transparent;color:var(--paper);box-shadow:none;border:1px solid var(--grid)}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}
</style>

<div id="stage">
  <div id="screen">
    <canvas id="c" aria-label="ゲーム画面"></canvas>
    <button id="pauseBtn" type="button" hidden>Ⅱ</button>
    <div class="overlay" id="title">
      <h1>ミサイル・コマンド<small>MISSILE COMMAND</small></h1>
      <p>降ってくるミサイルを迎撃して、6つの都市を守れ。</p>
      <div class="keys">
        画面をクリック／タップ → 一番近い基地から発射<br>
        PC：<b>A</b><b>S</b><b>D</b> で左・中・右の基地を指定<br>
        <b>P</b> 一時停止
      </div>
      <div id="hiTitle" class="keys"></div>
      <button id="startBtn" type="button">スタート</button>
    </div>
    <div class="overlay" id="paused" hidden>
      <div class="big">一時停止中</div>
      <button id="resumeBtn" type="button">再開</button>
    </div>
    <div class="overlay" id="over" hidden>
      <h1>THE END</h1>
      <p id="overText"></p>
      <button id="againBtn" type="button">もう一度</button>
    </div>
  </div>
</div>

<script>
(()=>{
const W=480,H=720,GROUND=H-56;
const C={ink:'#0a1024',ink2:'#121a38',grid:'#1d2a55',amber:'#ffb547',coral:'#ff5d6c',sky:'#7fd4ff',paper:'#e9ecff',ground:'#2b3a2a',dirt:'#5a4a2a'};
const FONT='"DotGothic16","Hiragino Kaku Gothic ProN","Meiryo",monospace';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),screenEl=document.getElementById('screen');
const $=id=>document.getElementById(id);

// ---------- sizing ----------
function fit(){
  const st=$('stage').getBoundingClientRect();
  let w=st.width,h=w*1.5; if(h>st.height){h=st.height;w=h/1.5}
  screenEl.style.width=w+'px';screenEl.style.height=h+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
}
addEventListener('resize',fit);fit();

// ---------- audio ----------
let ac=null;
function audio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function tone(f1,f2,dur,type='square',vol=.08){
  if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(f2,30),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur);
}
function boom(big){
  if(!ac)return;const t=ac.currentTime,len=big?.9:.45,b=ac.createBuffer(1,ac.sampleRate*len,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=big?600:1400;
  s.buffer=b;g.gain.value=big?.35:.18;s.connect(f).connect(g).connect(ac.destination);s.start(t);
}

// ---------- state ----------
let hi=0;try{hi=+localStorage.getItem('mc-hi')||0}catch(e){}
const baseX=[40,240,440],cityX=[95,145,195,285,335,385];
let G=null,running=false,paused=false,last=0,mouse={x:W/2,y:H/2,show:false};
const stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*(GROUND-80),r:Math.random()*1.2+.3,t:Math.random()*6}));

function newGame(){
  G={score:0,wave:0,cities:cityX.map(x=>({x,alive:true})),bases:baseX.map(x=>({x,alive:true,ammo:10})),
     enemies:[],shots:[],blasts:[],debris:[],toSpawn:0,spawnT:0,phase:'intro',phaseT:0,nextBonus:10000,bonusCities:0,bonusText:null,flash:0};
  nextWave();
}
function nextWave(){
  G.wave++;G.bases.forEach(b=>{b.alive=true;b.ammo=10});
  // restore a city from bonus stock
  while(G.bonusCities>0&&G.cities.some(c=>!c.alive)){G.cities.find(c=>!c.alive).alive=true;G.bonusCities--}
  G.toSpawn=8+G.wave*2;G.spawnT=1.2;G.enemies=[];G.shots=[];G.blasts=[];
  G.phase='intro';G.phaseT=2;
}
const speed=()=>22+G.wave*7;
function targets(){return [...G.cities.filter(c=>c.alive).map(c=>({x:c.x,y:GROUND})),...G.bases.filter(b=>b.alive).map(b=>({x:b.x,y:GROUND-6}))]}
function spawnEnemy(fromX,fromY,count){
  const ts=targets();if(!ts.length)return;
  const t=ts[Math.floor(Math.random()*ts.length)];
  const x0=fromX??Math.random()*W,y0=fromY??-5;
  const dx=t.x-x0,dy=t.y-y0,d=Math.hypot(dx,dy),s=speed()*(0.85+Math.random()*.3);
  G.enemies.push({x0,y0,x:x0,y:y0,vx:dx/d*s,vy:dy/d*s,tx:t.x,ty:t.y,
    split:count===undefined&&G.wave>=3&&Math.random()<Math.min(.12+G.wave*.03,.4)?(GROUND*.35+Math.random()*GROUND*.25):0});
}

// ---------- input ----------
function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function fire(x,y,baseIdx){
  if(!running||paused||!G||G.phase!=='play')return;
  y=Math.min(y,GROUND-24);
  let b=null;
  if(baseIdx!==undefined){const c=G.bases[baseIdx];if(c.alive&&c.ammo>0)b=c}
  else{let best=1e9;for(const c of G.bases)if(c.alive&&c.ammo>0){const d=Math.abs(c.x-x)+(c===G.bases[1]?-20:0);if(d<best){best=d;b=c}}}
  if(!b){tone(120,80,.12,'square',.05);return}
  b.ammo--;const sx=b.x,sy=GROUND-14,dx=x-sx,dy=y-sy,d=Math.hypot(dx,dy),s=b===G.bases[1]?520:380;
  G.shots.push({sx,sy,x:sx,y:sy,tx:x,ty:y,vx:dx/d*s,vy:dy/d*s});
  tone(900,300,.15,'triangle',.06);
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();const p=toLogical(e);mouse={...p,show:e.pointerType==='mouse'};fire(p.x,p.y)});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){const p=toLogical(e);mouse={...p,show:true}}});
cv.addEventListener('pointerleave',()=>mouse.show=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='a'||k==='1')fire(mouse.x,mouse.y,0);
  else if(k==='s'||k==='2')fire(mouse.x,mouse.y,1);
  else if(k==='d'||k==='3')fire(mouse.x,mouse.y,2);
  else if(k==='p'||k==='escape')togglePause();
});
function togglePause(force){
  if(!running)return;paused=force??!paused;$('paused').hidden=!paused;
  if(!paused){last=performance.now()}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)togglePause(true)});
$('pauseBtn').onclick=()=>togglePause();
$('resumeBtn').onclick=()=>togglePause(false);
function start(){audio();newGame();running=true;paused=false;$('title').hidden=true;$('over').hidden=true;$('paused').hidden=true;$('pauseBtn').hidden=false;last=performance.now()}
$('startBtn').onclick=start;$('againBtn').onclick=start;
function showHi(){$('hiTitle').textContent=hi?`ハイスコア ${hi.toLocaleString()}`:''}
showHi();

// ---------- update ----------
function addScore(n){
  G.score+=n;
  if(G.score>=G.nextBonus){G.nextBonus+=10000;G.bonusCities++;tone(600,1200,.4,'square',.07)}
}
function explode(x,y,max,enemy){G.blasts.push({x,y,r:2,max,t:0,enemy});boom(max>40)}
function destroyAt(x){
  for(const c of G.cities)if(c.alive&&Math.abs(c.x-x)<4){c.alive=false;G.flash=.25;burstDebris(c.x,GROUND,C.sky)}
  for(const b of G.bases)if(b.alive&&Math.abs(b.x-x)<4){b.alive=false;b.ammo=0;G.flash=.25;burstDebris(b.x,GROUND,C.amber)}
}
function burstDebris(x,y,col){for(let i=0;i<14;i++){const a=-Math.PI*Math.random(),s=60+Math.random()*120;G.debris.push({x,y:y-6,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col})}}

function update(dt){
  G.phaseT-=dt;G.flash=Math.max(0,G.flash-dt);
  if(G.phase==='intro'&&G.phaseT<=0)G.phase='play';
  if(G.phase==='play'){
    G.spawnT-=dt;
    if(G.toSpawn>0&&G.spawnT<=0){
      const n=Math.min(G.toSpawn,1+Math.floor(Math.random()*Math.min(4,1+G.wave/2)));
      for(let i=0;i<n;i++)spawnEnemy();G.toSpawn-=n;
      G.spawnT=Math.max(.9,3.2-G.wave*.18)*(0.6+Math.random()*.8);
    }
  }
  // shots
  for(let i=G.shots.length-1;i>=0;i--){const s=G.shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;
    if((s.vy<0&&s.y<=s.ty)||(s.vy>=0&&s.y>=s.ty)){explode(s.tx,s.ty,42,false);G.shots.splice(i,1)}}
  // enemies
  for(let i=G.enemies.length-1;i>=0;i--){const m=G.enemies[i];m.x+=m.vx*dt;m.y+=m.vy*dt;
    if(m.split&&m.y>=m.split){m.split=0;const k=2+(Math.random()<.4?1:0);for(let j=0;j<k;j++)spawnEnemy(m.x,m.y,0);}
    if(m.y>=m.ty-1){G.enemies.splice(i,1);explode(m.tx,m.ty-4,30,true);destroyAt(m.tx);continue}
  }
  // blasts
  for(let i=G.blasts.length-1;i>=0;i--){const b=G.blasts[i];b.t+=dt;
    const T=1.1;b.r=b.t<T*.45?b.max*(b.t/(T*.45)):b.max*Math.max(0,1-(b.t-T*.45)/(T*.55));
    if(!b.enemy)for(let j=G.enemies.length-1;j>=0;j--){const m=G.enemies[j];
      if(Math.hypot(m.x-b.x,m.y-b.y)<b.r){G.enemies.splice(j,1);addScore(25*Math.min(6,Math.ceil(G.wave/2)));G.blasts.push({x:m.x,y:m.y,r:2,max:34,t:0,enemy:false});tone(400,90,.25,'sawtooth',.05)}}
    if(b.t>=T)G.blasts.splice(i,1)}
  for(let i=G.debris.length-1;i>=0;i--){const d=G.debris[i];d.x+=d.vx*dt;d.y+=d.vy*dt;d.vy+=260*dt;d.life-=dt;if(d.life<=0)G.debris.splice(i,1)}

  if(!G.cities.some(c=>c.alive)&&G.blasts.length===0&&G.phase!=='end'){gameOver();return}
  if(G.phase==='play'&&G.toSpawn===0&&G.enemies.length===0&&G.blasts.length===0&&G.shots.length===0){
    const mult=Math.min(6,Math.ceil(G.wave/2));
    const ammo=G.bases.reduce((s,b)=>s+(b.alive?b.ammo:0),0),cities=G.cities.filter(c=>c.alive).length;
    const bonus=(ammo*5+cities*100)*mult;
    G.bonusText={ammo,cities,mult,bonus};addScore(bonus);G.phase='bonus';G.phaseT=3;tone(500,1000,.3,'square',.06);
  }
  if(G.phase==='bonus'&&G.phaseT<=0){G.bonusText=null;nextWave()}
}
function gameOver(){
  G.phase='end';running=false;$('pauseBtn').hidden=true;
  const isHi=G.score>hi;if(isHi){hi=G.score;try{localStorage.setItem('mc-hi',hi)}catch(e){}}
  boom(true);
  $('overText').innerHTML=`ウェーブ ${G.wave} で全都市が壊滅しました。<br><span class="big">${G.score.toLocaleString()} 点</span>${isHi?'<br>ハイスコア更新！':`<br>ハイスコア ${hi.toLocaleString()}`}`;
  showHi();
  setTimeout(()=>{$('over').hidden=false},900);
}

// ---------- draw ----------
function drawCity(x,alive){
  if(!alive){ctx.fillStyle='#3a3046';ctx.fillRect(x-16,GROUND-4,32,4);ctx.fillRect(x-10,GROUND-7,6,3);ctx.fillRect(x+3,GROUND-6,8,2);return}
  ctx.fillStyle=C.sky;
  const h=[10,16,12,20,9,14];h.forEach((hh,i)=>ctx.fillRect(x-16+i*5.5,GROUND-hh,5,hh));
  ctx.fillStyle=C.ink;for(let i=0;i<6;i++)for(let j=3;j<h[i]-2;j+=4)if((i+j)%3)ctx.fillRect(x-15+i*5.5,GROUND-h[i]+j,1.5,1.5);
}
function drawBase(b,i){
  ctx.fillStyle=C.dirt;ctx.beginPath();ctx.moveTo(b.x-34,GROUND);ctx.lineTo(b.x-16,GROUND-18);ctx.lineTo(b.x+16,GROUND-18);ctx.lineTo(b.x+34,GROUND);ctx.fill();
  if(!b.alive){ctx.fillStyle=C.coral;ctx.font=`12px ${FONT}`;ctx.textAlign='center';ctx.fillText('×',b.x,GROUND-6);return}
  // ammo pyramid
  ctx.fillStyle=C.amber;let n=0;
  for(let row=0;row<4&&n<b.ammo;row++)for(let k=0;k<=row&&n<b.ammo;k++){ctx.fillRect(b.x-row*4+k*8-1.5,GROUND-30+row*5,3,4);n++}
  ctx.fillStyle=b.ammo===0?C.coral:'rgba(233,236,255,.7)';ctx.font=`11px ${FONT}`;ctx.textAlign='center';
  ctx.fillText(b.ammo===0?'OUT':(b.ammo<=3?'LOW':''),b.x,GROUND-4);
}
function draw(time){
  const tt=time/1000;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,C.ink);g.addColorStop(1,C.ink2);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(G&&G.flash>0){ctx.fillStyle=`rgba(255,93,108,${G.flash*.6})`;ctx.fillRect(0,0,W,H)}
  // radar grid
  ctx.strokeStyle=C.grid;ctx.lineWidth=1;ctx.globalAlpha=.5;
  for(let y=60;y<GROUND;y+=60){ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5);ctx.stroke()}
  ctx.globalAlpha=1;
  for(const s of stars){ctx.fillStyle=`rgba(233,236,255,${.35+.3*Math.sin(tt*1.5+s.t)})`;ctx.fillRect(s.x,s.y,s.r,s.r)}
  // ground
  ctx.fillStyle=C.ground;ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle=C.amber;ctx.fillRect(0,GROUND,W,1);
  if(!G){drawIdle(tt);return}
  G.cities.forEach(c=>drawCity(c.x,c.alive));G.bases.forEach(drawBase);
  // enemy trails
  ctx.lineWidth=1.5;
  for(const m of G.enemies){ctx.strokeStyle='rgba(255,93,108,.75)';ctx.beginPath();ctx.moveTo(m.x0,m.y0);ctx.lineTo(m.x,m.y);ctx.stroke();
    ctx.fillStyle=(Math.floor(tt*12)%2)?'#fff':C.coral;ctx.fillRect(m.x-1.5,m.y-1.5,3,3)}
  // shots
  for(const s of G.shots){ctx.strokeStyle='rgba(255,181,71,.8)';ctx.beginPath();ctx.moveTo(s.sx,s.sy);ctx.lineTo(s.x,s.y);ctx.stroke();
    ctx.fillStyle='#fff';ctx.fillRect(s.x-1.5,s.y-1.5,3,3);
    ctx.strokeStyle=C.amber;ctx.beginPath();ctx.moveTo(s.tx-5,s.ty-5);ctx.lineTo(s.tx+5,s.ty+5);ctx.moveTo(s.tx+5,s.ty-5);ctx.lineTo(s.tx-5,s.ty+5);ctx.stroke()}
  // blasts
  const pal=['#fff7d6',C.amber,C.coral,C.sky,'#c89bff'];
  for(const b of G.blasts){ctx.fillStyle=pal[Math.floor(tt*20+b.x)%pal.length];ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(b.x,b.y,Math.max(0,b.r),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
  for(const d of G.debris){ctx.fillStyle=d.col;ctx.globalAlpha=Math.max(0,d.life);ctx.fillRect(d.x,d.y,2,2)}ctx.globalAlpha=1;
  // crosshair
  if(mouse.show&&running){ctx.strokeStyle=C.paper;ctx.lineWidth=1;ctx.beginPath();ctx.arc(mouse.x,mouse.y,9,0,Math.PI*2);
    ctx.moveTo(mouse.x-14,mouse.y);ctx.lineTo(mouse.x-5,mouse.y);ctx.moveTo(mouse.x+5,mouse.y);ctx.lineTo(mouse.x+14,mouse.y);
    ctx.moveTo(mouse.x,mouse.y-14);ctx.lineTo(mouse.x,mouse.y-5);ctx.moveTo(mouse.x,mouse.y+5);ctx.lineTo(mouse.x,mouse.y+14);ctx.stroke()}
  // HUD
  ctx.textAlign='left';ctx.font=`18px ${FONT}`;ctx.fillStyle=C.amber;ctx.fillText(G.score.toLocaleString().padStart(7,' '),12,28);
  ctx.font=`12px ${FONT}`;ctx.fillStyle='rgba(233,236,255,.7)';ctx.fillText(`HI ${Math.max(hi,G.score).toLocaleString()}`,12,46);
  ctx.textAlign='center';ctx.fillStyle=C.paper;ctx.fillText(`WAVE ${G.wave}  ×${Math.min(6,Math.ceil(G.wave/2))}`,W/2,24);
  if(G.bonusCities){ctx.textAlign='left';ctx.fillStyle=C.sky;ctx.fillText(`予備都市 ${G.bonusCities}`,12,H-14)}
  ctx.textAlign='right';ctx.fillStyle='rgba(233,236,255,.55)';ctx.fillText(`残り弾 ${G.bases.reduce((s,b)=>s+(b.alive?b.ammo:0),0)}`,W-12,H-14);
  // banners
  ctx.textAlign='center';
  if(G.phase==='intro'){ctx.font=`30px ${FONT}`;ctx.fillStyle=C.amber;ctx.fillText(`WAVE ${G.wave}`,W/2,H*.38);
    ctx.font=`15px ${FONT}`;ctx.fillStyle=C.paper;ctx.fillText(`都市を守れ　得点 ×${Math.min(6,Math.ceil(G.wave/2))}`,W/2,H*.38+32)}
  if(G.phase==='bonus'&&G.bonusText){const b=G.bonusText;ctx.font=`24px ${FONT}`;ctx.fillStyle=C.amber;ctx.fillText('ウェーブ クリア',W/2,H*.33);
    ctx.font=`15px ${FONT}`;ctx.fillStyle=C.paper;
    ctx.fillText(`残り弾 ${b.ammo} × 5 × ${b.mult}`,W/2,H*.33+36);ctx.fillText(`残存都市 ${b.cities} × 100 × ${b.mult}`,W/2,H*.33+60);
    ctx.font=`20px ${FONT}`;ctx.fillStyle=C.sky;ctx.fillText(`ボーナス +${b.bonus.toLocaleString()}`,W/2,H*.33+96)}
}
// attract mode behind the title screen
const idle={m:[],b:[]};
function drawIdle(tt){
  cityX.forEach(x=>drawCity(x,true));baseX.forEach(x=>drawBase({x,alive:true,ammo:10}));
  if(Math.random()<.02)idle.m.push({x0:Math.random()*W,y0:0,t:0,tx:cityX[Math.floor(Math.random()*6)]});
  ctx.lineWidth=1.5;
  for(let i=idle.m.length-1;i>=0;i--){const m=idle.m[i];m.t+=.004;const x=m.x0+(m.tx-m.x0)*m.t,y=GROUND*m.t;
    ctx.strokeStyle='rgba(255,93,108,.7)';ctx.beginPath();ctx.moveTo(m.x0,0);ctx.lineTo(x,y);ctx.stroke();
    if(m.t>.3+Math.random()*.4&&Math.random()<.01){idle.b.push({x,y,t:0});idle.m.splice(i,1)}else if(m.t>=1)idle.m.splice(i,1)}
  for(let i=idle.b.length-1;i>=0;i--){const b=idle.b[i];b.t+=.016;const r=b.t<.5?b.t*80:Math.max(0,40-(b.t-.5)*70);
    ctx.fillStyle=C.amber;ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(b.x,b.y,r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;if(b.t>1.1)idle.b.splice(i,1)}
}

function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(running&&!paused&&G)update(dt);
  draw(t);requestAnimationFrame(loop);
}
requestAnimationFrame(t=>{last=t;loop(t)});
})();
</script>
